<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="ShareAnything - 간편하고 안전한 파일 공유 서비스"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShareAnything" />
    <meta property="og:title" content="ShareAnything" />
    <meta property="og:description" content="ShareAnything으로 간편하고 안전하게 파일을 공유해보세요" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:url" content="https://share.mingyu.dev" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShareAnything" />
    <meta name="twitter:description" content="ShareAnything으로 간편하고 안전하게 파일을 공유해보세요" />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" />

    <title>ShareAnything</title>
  </head>
  <body>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0a0a0a');
        }
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
